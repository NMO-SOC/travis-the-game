<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travis: Arena</title>
<style>
:root{--bg:#07090d;--ink:#efe6cf;--ink-soft:#a99f88;--gold:#d6b25a;--gold-2:#f3dc97;--t0:#5aa8ff;--t1:#ff7a52;--red:#e0483a;--green:#6fcf4a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 12px 140px}
/* Battle mode: the board is a fixed stage, not a web page — nothing above it scrolls. Set on <body>
   only while renderBattle() is showing (see setBattleMode in the script). */
body.battle-mode{overflow:hidden}
body.battle-mode main{height:100dvh;max-width:860px;padding:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto auto auto;
  padding:8px 10px env(safe-area-inset-bottom);gap:2px}
h1{font-size:26px;margin:10px 0 2px}
h2{font-size:16px;margin:16px 0 6px;color:var(--gold-2)}
p{margin:4px 0}
.muted{opacity:.7;font-size:14px}
.btn{display:inline-block;font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--gold);background:linear-gradient(180deg,#2b2a2f,#141318);color:var(--gold-2);cursor:pointer;margin:4px 6px 4px 0}
.btn.gold{color:#1c1405;background:linear-gradient(180deg,#f7e2a1,#d6b25a 45%,#9c7626);border-color:#f7e2a1}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.hero-pick{display:flex;gap:10px;flex-wrap:wrap}
.hero-opt{border:2px solid #333;border-radius:12px;padding:10px;width:150px;cursor:pointer;background:#141318}
.hero-opt.on{border-color:var(--gold)}
.hero-opt img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;object-position:50% 12%}
.hero-opt b{display:block;margin-top:6px;font-size:14px}
.hero-opt small{opacity:.75}
.pass{position:fixed;inset:0;z-index:20;background:#000e;display:grid;place-items:center;text-align:center;padding:24px}
.pass h2{font-size:24px}
.bar{padding:8px 4px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
/* ---- hero row: a big circular portrait per side, Hearthstone-style, centred in its row, with an
   HP gem overlapping its bottom-right corner and (for the active player) mana crystals + hero power
   wrapping underneath it rather than stretching the row off-centre ---- */
.herorow{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0;flex-wrap:wrap;text-align:center}
.herorow.me{flex-direction:column;gap:2px}
.herorow.me .hero-controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.hero-circle{position:relative;flex:none;width:clamp(44px,8vh,72px);height:clamp(44px,8vh,72px);border-radius:50%;cursor:default}
.hero-circle img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 12%;border:3px solid #4a3a16;box-shadow:0 0 0 2px var(--gold),0 2px 6px #000}
.hero-circle.t0 img{box-shadow:0 0 0 2px var(--t0),0 2px 6px #000}
.hero-circle.t1 img{box-shadow:0 0 0 2px var(--t1),0 2px 6px #000}
.hero-circle .hpgem{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a5a,var(--red) 70%);
  color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;box-shadow:0 0 0 2px #000,0 1px 3px #000}
.hero-circle .hpgem.low{animation:pulse .7s infinite alternate}
.hero-circle.target{cursor:pointer}
.hero-circle.target img{box-shadow:0 0 0 3px var(--gold-2),0 0 16px rgba(243,220,151,.6);animation:pulse .6s infinite alternate}
.hero-name{font-size:13px;font-weight:700;opacity:.85}
.mana{display:flex;gap:3px;align-items:center}
.mana i{width:14px;height:14px;border-radius:3px;transform:rotate(45deg);background:#1a2b4a;box-shadow:inset 0 0 0 1px #2d4a7a}
.mana i.full{background:linear-gradient(160deg,#7fc4ff,var(--t0));box-shadow:inset 0 0 0 1px #bfe4ff,0 0 4px rgba(90,168,255,.7)}
.points{font-size:12px;opacity:.75;margin-left:2px}
.field{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;min-height:0;height:100%;padding:4px 8px;border-radius:10px;background:#0c0e13;margin:2px 0;overflow:hidden}
.mon{position:relative;flex:0 0 clamp(56px,11vh,88px);border:2px solid #333;border-radius:10px;padding:3px;background:#171a21;cursor:default;text-align:center;
  transition:transform .15s,box-shadow .15s,z-index 0s;transform-origin:50% 70%}
.mon.taunt{border-color:var(--gold)}
.mon.ready{cursor:pointer;box-shadow:0 0 0 2px var(--green)}
.mon.target{cursor:pointer;box-shadow:0 0 0 3px var(--gold-2);animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px #fff6}}
.mon.sick{opacity:.6}
.mon:hover{transform:scale(1.8);z-index:15;box-shadow:0 10px 30px #000}
.mon img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;object-position:50% 12%}
.mon .name{font-size:9.5px;font-weight:700;margin:7px 0 1px;line-height:1.1;min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon:hover .name{white-space:normal}
.mon .gem{position:absolute;bottom:20px;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;box-shadow:0 0 0 2px #000}
.mon .gem.a{left:-4px;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 70%);color:#1c1405}
.mon .gem.h{right:-4px;background:radial-gradient(circle at 35% 30%,#ff6a5a,var(--red) 70%)}
.mon .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1c1405;font-size:9px;font-weight:900;padding:1px 6px;border-radius:8px}
/* Ability text: always there in the DOM (so it's never a mystery once a monster's on the board — the
   brief complaint was that it vanished after summoning), just tucked under the name at normal size
   and revealed in full by the hover-scale above. */
.mon .ability{font-size:8px;line-height:1.2;color:var(--gold-2);opacity:.85;max-height:0;overflow:hidden}
.mon:hover .ability{max-height:none}
.mon.atk-anim{animation:lunge .45s ease}
.mon.hit-anim,.hero-circle.hit-anim img{animation:hitflash .4s ease}
@keyframes lunge{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(1.12)}65%{transform:translateY(3px) scale(1.02)}100%{transform:translateY(0) scale(1)}}
@keyframes hitflash{0%{filter:brightness(1)}25%{filter:brightness(2.4) saturate(2);transform:translateX(-4px)}55%{transform:translateX(4px)}100%{filter:brightness(1);transform:translateX(0)}}
.hand{display:flex;gap:6px;overflow-x:auto;overflow-y:visible;padding:14px 2px 2px;justify-content:center;flex:none}
.card{flex:none;width:clamp(56px,10vh,86px);border:2px solid #333;border-radius:10px 10px 14px 14px;padding:3px;background:#171a21;cursor:pointer;text-align:center;position:relative;
  transition:transform .15s,box-shadow .15s,z-index 0s;transform-origin:50% 100%}
.card:not(.off):hover{transform:translateY(-6px) scale(1.7);z-index:15;box-shadow:0 10px 30px #000}
.card.on{border-color:var(--gold-2);box-shadow:0 0 0 2px var(--gold-2);transform:translateY(-6px)}
.card.off{opacity:.4;cursor:default}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;object-position:50% 12%}
.card-icon{width:100%;aspect-ratio:3/4;border-radius:6px;background:#0c0e13;display:grid;place-items:center;font-size:22px}
.card .cost{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fc4ff,var(--t0) 70%);color:#06203f;font-weight:900;display:grid;place-items:center;font-size:14px;box-shadow:0 0 0 2px #000}
.card .name{font-size:9.5px;font-weight:700;margin-top:3px;line-height:1.1;min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover .name{white-space:normal}
.card .txt{font-size:9px;opacity:.75;line-height:1.2;max-height:0;overflow:hidden}
.card:hover .txt{max-height:none}
.status{text-align:center;font-weight:700;font-size:13px;margin:0;line-height:1.3}
.hint{text-align:center;margin:0 0 2px;font-size:12px}
/* Battle log: a slide-up drawer instead of a permanent block under the hand — that permanent block
   was most of why the board needed scrolling to begin with. Toggled from the action bar. */
.logdrawer{position:fixed;left:0;right:0;bottom:0;max-height:45vh;background:#0c0e13;border-top:1px solid #8a6a22;
  border-radius:14px 14px 0 0;box-shadow:0 -10px 30px #000a;transform:translateY(100%);transition:transform .25s ease;z-index:30}
.logdrawer.open{transform:translateY(0)}
.logdrawer .loghead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #222}
.logdrawer .loghead b{font-size:13px}
.log{padding:8px 12px;max-height:calc(45vh - 40px);overflow-y:auto;font-size:13px}
.log p{margin:4px 0;opacity:.85}
.over{position:fixed;inset:0;z-index:30;background:#000e;display:grid;place-items:center;text-align:center;padding:24px}
.over h1{font-size:40px}
.peek{position:fixed;inset:0;z-index:25;background:#000c;display:grid;place-items:center;padding:20px}
.peek .box{background:#141318;border:1px solid var(--gold);border-radius:14px;padding:16px;max-width:360px;text-align:center}
.cpu-tag{font-size:11px;opacity:.7;font-style:italic}
/* A small floating marker that jumps to whatever the CPU just acted on (see placeCpuCursor in the
   script), so its turn is watchable instead of a blackout — a lightweight stand-in for a real
   mouse/wand cursor. */
.cpu-cursor{position:fixed;z-index:40;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:3px solid #ff6a5a;box-shadow:0 0 0 4px rgba(255,106,90,.25),0 0 14px rgba(255,106,90,.6);
  pointer-events:none;transition:left .5s ease,top .5s ease;animation:cpuPulse .6s infinite alternate}
.cpu-cursor::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,106,90,.5)}
@keyframes cpuPulse{to{transform:scale(1.15)}}
</style>
</head>
<body>
<main id="app"><p>Loading&hellip;</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="cards.js?v=20261006a"></script>
<script src="account.js?v=20261006a"></script>
<script src="tcg-cards.js?v=20261007b"></script>
<script src="tcg-rules.js?v=20261007e"></script>
<script>
'use strict';
/* Travis: Arena — hotseat 2-player, one device, pass between turns. Online sync and a real
   deckbuilder are still deferred (see TCG-MODE.md), but a signed-in player can bring one of their
   saved SmalLab decks (account.js) instead of the shared default — see deckFromSmalLab() below. All
   game logic lives in tcg-rules.js; this file is render + input only. */
const ACC = window.TravisAccount;
const R = TCGRules, app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const IMG = id => (R.MONSTER[id] && R.MONSTER[id].img) || (R.HERO[id] && R.HERO[id].img) || 'images/beer-frog-knox.jpg';

let g = null, names = ['Player 1', 'Player 2'], heroPick = [TCG_HEROES[0].id, TCG_HEROES[1].id];
let sel = null;          // {kind:'card', hi} or {kind:'mon', idx} or {kind:'power'} — what's "armed" to target
let passFor = null;      // team that must tap "I'm ready" before seeing the board (hides the other's hand)
let seenRound = 0;
let vsCpu = true;        // default to CPU on the setup screen — team 1 is a bot (tcg-rules.js cpuTurn)
let cpuThinking = false; // true while a cpuStep() is scheduled, to block input
let cpuCursor = null;    // last R.cpuStep() result, so placeCpuCursor() can point at what it just did
let fxAttack = null;     // {kind:'atk'|'hit', team, idx} | {kind:'hit', hero:team} — one-shot attack animation
let deckChoice = ['default', 'default'];  // 'default' or a SmalLab deck id, per team (team 1 ignored when vsCpu)
let signinErr = '', signinBusy = false;
let logOpen = false;     // battle log is a slide-up drawer, closed by default — see setBattleMode

/* A signed-in player can bring one of their saved SmalLab decks instead of the shared default. There's
   no Arena deckbuilder yet (see TCG-MODE.md), so this is a mechanical conversion, not a real 1:1 port:
   each of the deck's 6 characters becomes 3 copies of its Arena monster card (favoring what they
   actually built around), plus every spell once, padded out to 45 by cycling the spell list. A
   character with no Arena equivalent (story/Chairman cards aren't in TCG_MONSTERS) is just skipped. */
function deckFromSmalLab(d) {
  const list = [];
  (d.characters || []).forEach(id => { if (R.MONSTER[id]) for (let i = 0; i < 3; i++) list.push(id); });
  TCG_SPELLS.forEach(s => list.push(s.id));
  for (let i = 0; list.length < 45; i++) list.push(TCG_SPELLS[i % TCG_SPELLS.length].id);
  return list.slice(0, 45);
}
function resolvedDeck(t) {
  if (t === 1 && vsCpu) return null; // the bot always plays the shared default deck
  if (deckChoice[t] === 'default' || !ACC || !ACC.decks) return null;
  const d = ACC.decks.find(x => String(x.id) === deckChoice[t]);
  return d ? deckFromSmalLab(d) : null;
}

function render() {
  if (!g) { setBattleMode(false); return renderSetup(); }
  if (passFor !== null) { setBattleMode(false); return renderPass(); }
  if (g.winner !== null) { setBattleMode(false); return renderOver(); }
  setBattleMode(true);
  renderBattle();
  if (vsCpu && g.turn === 1) placeCpuCursor();
}
/* The battle screen is a fixed no-scroll stage (see .battle-mode in the stylesheet); every other
   screen is a normal scrolling page. Toggled on <body> rather than baked into main's CSS alone so
   setup/pass/game-over never accidentally inherit the fixed height on a short screen. */
function setBattleMode(on) { document.body.classList.toggle('battle-mode', on); }

function renderSetup() {
  const opt = (t) => `<div class="hero-pick">${TCG_HEROES.map(h => `
    <div class="hero-opt ${heroPick[t] === h.id ? 'on' : ''}" data-pick="${t}:${h.id}">
      <img src="${h.img}" alt=""><b>${esc(h.n)}</b><small>${esc(h.power.n)}: ${esc(h.power.txt)}</small>
    </div>`).join('')}</div>`;
  const modeBtn = (v, label, sub) => `<div class="hero-opt ${vsCpu === v ? 'on' : ''}" data-mode="${v}" style="width:200px"><b>${label}</b><small>${sub}</small></div>`;
  const signedIn = ACC && ACC.ready && ACC.user && ACC.profile;
  // Only one Supabase session exists on this device, so only Player 1 can bring a signed-in account's
  // deck in hotseat — Player 2/CPU always get the shared default (no sign-out/in dance mid-pass).
  const deckPicker = (t) => {
    if (t !== 0) return vsCpu ? '' : '<p class="muted">Plays the shared default deck (only one SmalLab account can be signed in per device).</p>';
    if (!signedIn) return '<p class="muted">Sign in below to bring one of your saved decks — otherwise you play the shared default deck.</p>';
    const decks = ACC.decks || [];
    if (!decks.length) return '<p class="muted">No saved decks yet — build one in SmalLab mode&rsquo;s Decks screen, or just play the default deck.</p>';
    return `<select data-deckpick="${t}">
      <option value="default" ${deckChoice[t] === 'default' ? 'selected' : ''}>Default deck (shared, 45 cards)</option>
      ${decks.map(d => `<option value="${esc(String(d.id))}" ${deckChoice[t] === String(d.id) ? 'selected' : ''}>${esc(d.name)} (your SmalLab deck)</option>`).join('')}
    </select>`;
  };
  const signin = signedIn ? `<p>Signed in as <b>${esc(ACC.profile.username)}</b> &middot; <button class="btn sm" data-act="signout">Sign out</button></p>`
    : !ACC || !ACC.available ? ''
    : `<form id="signin"><input id="su" autocomplete="username" autocapitalize="none" placeholder="SmalLab username" required>
      <input id="sp" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn sm" ${signinBusy ? 'disabled' : ''}>Sign in to use my decks</button></form>
      ${signinErr ? `<p class="muted" style="color:var(--red)">${esc(signinErr)}</p>` : ''}`;
  app.innerHTML = `<h1>Travis: Arena</h1>
    <p class="muted">Summon monsters and cast spells from your hand by spending summon points — you gain one more each turn. Your hero has 30 HP; once your field is empty, that's what gets hit.</p>
    <h2>Opponent</h2>
    <div class="hero-pick">${modeBtn(false, 'Two Players', 'Pass the device each turn')}${modeBtn(true, 'Versus CPU', 'Play solo against a bot opponent')}</div>
    <h2>Your SmalLab account</h2>${signin}
    <h2>Player 1&rsquo;s hero</h2>${opt(0)}${deckPicker(0)}
    <h2>${vsCpu ? 'CPU&rsquo;s' : 'Player 2&rsquo;s'} hero</h2>${opt(1)}${deckPicker(1)}
    <button class="btn gold" data-act="start">Start game</button>
    <p class="muted"><a href="play.html" style="color:var(--gold-2)">&larr; Back to SmalLab mode</a></p>`;
}

function renderPass() {
  const t = passFor;
  app.innerHTML = `<div class="pass"><div><h2>Pass the device to ${esc(names[t])}</h2>
    <p class="muted">Nobody else look.</p>
    <button class="btn gold" data-act="reveal">I&rsquo;m ${esc(names[t])} — show my turn</button></div></div>`;
}

function renderOver() {
  app.innerHTML = `<div class="over"><div><h1>${esc(names[g.winner])} wins!</h1>
    <button class="btn gold" data-act="rematch">Rematch &mdash; same heroes</button>
    <button class="btn" data-act="setup">Change hero / new game</button></div></div>`;
}

function monCard(u, t, viewer) {
  const canSelectAsAttacker = sel === null && t === viewer && g.turn === viewer && R.canAttack(g, t, u.idx);
  const isTarget = sel && sel.kind !== 'power' ? targetsFor(viewer).some(x => x.kind === 'monster' && x.team === t && x.idx === u.idx) : false;
  const card = R.MONSTER[u.id];
  const fx = fxAttack;
  const atkFx = fx && fx.atk && fx.atk.team === t && fx.atk.idx === u.idx ? ' atk-anim' : '';
  const hitFx = fx && fx.hit && fx.hit.team === t && fx.hit.idx === u.idx ? ' hit-anim' : '';
  const cls = ['mon', u.taunt ? 'taunt' : '', u.sick ? 'sick' : '', canSelectAsAttacker ? 'ready' : '', isTarget ? 'target' : '', atkFx, hitFx].join(' ');
  return `<div class="${cls}" data-mon="${t}:${u.idx}">
    ${u.taunt ? '<span class="tag">TAUNT</span>' : ''}
    <img src="${IMG(u.id)}" alt="">
    <div class="name">${esc(u.n)}</div>
    <div class="ability">${card && card.bc ? esc(card.bc) : card && card.flavor ? '<i>' + card.flavor + '</i>' : ''}</div>
    <span class="gem a">${Math.max(0, u.atk + (u.atkMod || 0))}</span><span class="gem h">${u.hp}</span>
  </div>`;
}
/* Hearthstone-style mana crystal row: one diamond per point of this turn's max, lit for what's
   still unspent. Shown for the viewer's own side only — the opponent's pool is just text. */
function manaRow(t) {
  let out = '';
  for (let i = 0; i < g.maxPoints[t]; i++) out += `<i class="${i < g.points[t] ? 'full' : ''}"></i>`;
  return `<div class="mana">${out}</div>`;
}

/* What a currently-armed selection (a hand card, a ready monster, or the hero power) can legally hit —
   drives both highlighting and the actual target sent to tcg-rules.js. kind:'monster' needs {team,idx};
   attacks compute their own via R.attackTargets. */
function targetsFor(viewer) {
  if (!sel) return [];
  const t = g.turn;
  if (sel.kind === 'mon') return R.attackTargets(g, t);
  const card = sel.kind === 'card' ? R.MONSTER[g.hand[t][sel.hi]] || R.SPELL[g.hand[t][sel.hi]] : R.HERO[g.hero[t].id].power;
  const to = card.to;
  if (to === 'enemy') return R.aliveField(g, 1 - t).map(u => ({ kind: 'monster', team: 1 - t, idx: u.idx }));
  if (to === 'friend') return R.aliveField(g, t).map(u => ({ kind: 'monster', team: t, idx: u.idx }));
  if (to === 'friendOrNone') return R.aliveField(g, t).map(u => ({ kind: 'monster', team: t, idx: u.idx })).concat([{ kind: 'none' }]);
  return [];
}

function handCard(id, hi, t) {
  const mon = R.MONSTER[id], c = mon || R.SPELL[id];
  const affordable = c.cost <= g.points[t] && g.turn === t;
  const on = sel && sel.kind === 'card' && sel.hi === hi;
  const art = mon ? `<img src="${mon.img}" alt="">` : `<div class="card-icon">&#10024;</div>`;
  return `<div class="card ${on ? 'on' : ''} ${affordable ? '' : 'off'}" data-card="${hi}">
    <span class="cost">${c.cost}</span>${art}
    <div class="name">${esc(c.n)}</div>
    <div class="txt">${c.txt || c.bc || c.flavor || ''}</div>
  </div>`;
}

function renderBattle() {
  /* In Versus CPU, the board is always shown from the human's own side (bottom = you, top = CPU),
     even during the CPU's turn, instead of blacking out — see placeCpuCursor() for the "what is it
     doing" cursor overlay. In hotseat, each pass still flips the perspective to whoever's playing. */
  const watching = vsCpu && g.turn === 1;
  const viewer = vsCpu ? 0 : g.turn, me = viewer, opp = 1 - viewer;
  const heroTargetable = t => t === opp && !!sel && sel.kind === 'mon' && targetsFor(viewer).some(x => x.kind === 'hero');
  /* Hearthstone-style hero: a circular portrait with an HP gem overlapping its corner. Only the
     active player's own hero gets mana crystals and the hero-power button beside it. */
  const heroCircle = (h, t) => {
    const low = h.hp <= 10;
    const hitFx = fxAttack && fxAttack.hit && fxAttack.hit.hero === t ? ' hit-anim' : '';
    return `<div class="hero-circle t${t}${heroTargetable(t) ? ' target' : ''}${hitFx}" ${heroTargetable(t) ? `data-hero="${t}"` : ''}>
      <img src="${IMG(h.id)}" alt=""><span class="hpgem ${low ? 'low' : ''}">${h.hp}</span></div>`;
  };
  const power = R.HERO[g.hero[me].id].power;
  const powerOn = sel && sel.kind === 'power';
  const canPower = R.heroPowerUsable(g, me);
  /* A one-line nudge so an empty field + a greyed-out hand (quite possible turn 1 — your 3-card
     starting hand has no guaranteed 1-cost card) doesn't just look broken. */
  const hint = watching ? 'Watching ' + esc(names[opp]) + '&rsquo;s turn&hellip;'
    : sel ? 'Tap a glowing target to confirm.'
    : g.hand[me].some((id, hi) => R.canPlay(g, me, hi)) ? 'Tap a card in your hand to summon or cast it.'
    : R.aliveField(g, me).some(u => R.canAttack(g, me, u.idx)) ? 'Tap a glowing monster, then an enemy, to attack.'
    : 'Nothing to play this turn &mdash; tap End turn.';
  app.innerHTML = `
    <div class="stage">
      <div class="herorow opp">${heroCircle(g.hero[opp], opp)}<span class="hero-name">${esc(names[opp])}${watching ? ' <i class="cpu-tag">thinking&hellip;</i>' : ''}</span></div>
      <div class="field" id="oppfield">${g.field[opp].map(u => monCard(u, opp, viewer)).join('') || '<p class="muted" style="margin:auto">No monsters — attacks hit the hero.</p>'}</div>
      <div><div class="status">Round ${g.round} &middot; <b>${esc(names[watching ? opp : me])}&rsquo;s turn</b></div>
      <p class="hint muted">${hint}</p></div>
      <div class="field" id="mefield">${g.field[me].map(u => monCard(u, me, viewer)).join('') || '<p class="muted" style="margin:auto">No monsters on your field yet.</p>'}</div>
      <div class="herorow me">${heroCircle(g.hero[me], me)}<span class="hero-name">${esc(names[me])}</span>
        <div class="hero-controls">${manaRow(me)}<span class="points">${g.points[me]}/${g.maxPoints[me]}</span>
        <button class="btn sm ${powerOn ? 'gold' : ''}" data-act="power" ${(canPower || powerOn) && !watching ? '' : 'disabled'}>${esc(power.n)} (${power.cost})</button></div></div>
      <div class="hand" id="myhand">${g.hand[me].map((id, hi) => handCard(id, hi, me)).join('') || '<p class="muted">Empty hand.</p>'}</div>
      <div class="bar">
        <button class="btn sm" data-act="togglelog">Log</button>
        ${sel && targetsFor(me).some(x => x.kind === 'none') ? '<button class="btn sm gold" data-act="notarget">Target your hero</button>' : ''}
        ${sel ? '<button class="btn sm" data-act="cancel">Cancel</button>' : ''}
        <button class="btn gold" data-act="end" ${watching ? 'disabled' : ''}>End turn</button>
      </div>
    </div>
    <div class="logdrawer${logOpen ? ' open' : ''}"><div class="loghead"><b>Battle log</b><button class="btn sm" data-act="togglelog">Close</button></div>
      <div class="log" id="log">${g.log.slice(-60).map(l => `<p>${l}</p>`).join('')}</div></div>
    <div id="cpucursor" class="cpu-cursor" hidden></div>
    ${g.peek && g.peek.team === me ? peekHtml() : ''}`;
  const log = document.getElementById('log'); if (log) log.scrollTop = log.scrollHeight;
}

function peekHtml() {
  const hand = g.peek.hand.map(id => (R.MONSTER[id] || R.SPELL[id]).n).join(', ') || 'nothing';
  return `<div class="peek" data-act="peekclose"><div class="box"><h2>Opponent&rsquo;s hand</h2><p>${esc(hand)}</p>
    <button class="btn gold sm" data-act="peekclose">Got it</button></div></div>`;
}

/* ---------------- actions ---------------- */
function startGame() {
  g = R.newGame(heroPick, [resolvedDeck(0), resolvedDeck(1)], Math.random);
  names = vsCpu ? ['Player 1', 'CPU'] : ['Player 1', 'Player 2'];
  seenRound = 1; sel = null; cpuThinking = false;
  passFor = vsCpu ? null : 0; // CPU never needs a pass screen — only one human at the table
  render();
}
/* Runs after any action that might have ended the turn — if it's now the bot's turn, plays it one
   action at a time (R.cpuStep), rendering and pointing the cursor at each action in turn instead of
   resolving the whole turn instantly behind a blackout. cpuThinking is a re-entrancy guard against
   scheduling two overlapping bot turns. */
function maybeRunCpu() {
  if (!vsCpu || !g || g.winner !== null || g.turn !== 1 || cpuThinking) return;
  cpuThinking = true;
  runCpuStep();
}
function runCpuStep() {
  setTimeout(() => {
    if (!g || g.turn !== 1 || g.winner !== null) { cpuThinking = false; cpuCursor = null; return; }
    const r = R.cpuStep(g, 1);
    if (r.done) {
      cpuThinking = false; cpuCursor = null;
      R.endTurn(g);
      return render();
    }
    cpuCursor = r;
    if (r.kind === 'attack') {
      const hit = r.target.kind === 'hero' ? { hero: 0 } : { team: r.target.team, idx: r.target.idx };
      fxAttack = { atk: { team: 1, idx: r.idx }, hit };
      setTimeout(() => { fxAttack = null; }, 450); // cleared silently — the next render() below already moves on
    }
    render();
    runCpuStep();
  }, 700);
}
/* Points #cpucursor at whatever DOM element corresponds to the last R.cpuStep() result: the newly
   summoned monster, the attacker, or (for a spell/power with no stable card element left in hand)
   just the CPU's own portrait as a generic "it did something" marker. */
function placeCpuCursor() {
  const el = document.getElementById('cpucursor');
  if (!el) return;
  if (!cpuCursor) { el.hidden = true; return; }
  let target = null;
  if (cpuCursor.kind === 'card' && R.MONSTER[cpuCursor.id]) target = document.querySelector('#oppfield .mon:last-child');
  else if (cpuCursor.kind === 'attack') target = document.querySelector(`#oppfield [data-mon="1:${cpuCursor.idx}"]`);
  if (!target) target = document.querySelector('.herorow.opp .hero-circle');
  if (!target) { el.hidden = true; return; }
  const r = target.getBoundingClientRect();
  el.style.left = (r.left + r.width / 2) + 'px';
  el.style.top = (r.top + r.height / 2) + 'px';
  el.hidden = false;
}
/* A one-shot CSS animation: render once with the fx class present, then clear it on a timer so the
   next render (whenever it happens) comes back to normal rather than re-triggering forever. */
function flashAttack(fx) {
  fxAttack = fx;
  setTimeout(() => { fxAttack = null; render(); }, 450);
}
function doTarget(target) {
  const t = g.turn;
  if (sel.kind === 'mon') {
    const hit = target.kind === 'hero' ? { hero: 1 - t } : { team: 1 - t, idx: target.idx };
    R.attack(g, t, sel.idx, target);
    flashAttack({ atk: { team: t, idx: sel.idx }, hit });
  }
  else if (sel.kind === 'power') { R.useHeroPower(g, t, target && target.kind === 'monster' ? target : null); }
  else {
    const id = g.hand[t][sel.hi], c = R.SPELL[id];
    if (c && c.sac) {
      const alive = R.aliveField(g, t);
      const weakest = alive.length ? alive.reduce((a, b) => a.hp <= b.hp ? a : b) : null;
      R.playCard(g, t, sel.hi, target && target.kind === 'monster' ? target : null, weakest ? weakest.idx : null);
    } else {
      R.playCard(g, t, sel.hi, target && target.kind === 'monster' ? target : null);
    }
  }
  sel = null; render();
}
app.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if (pick) { const [t, id] = pick.dataset.pick.split(':'); heroPick[+t] = id; return render(); }
  const mode = e.target.closest('[data-mode]');
  if (mode) { vsCpu = mode.dataset.mode === 'true'; return render(); }
  const b = e.target.closest('[data-act]');
  if (b) {
    const act = b.dataset.act;
    if (act === 'start') return startGame();
    if (act === 'setup') { g = null; sel = null; passFor = null; return render(); }
    if (act === 'rematch') return startGame();
    if (act === 'reveal') { passFor = null; return render(); }
    if (act === 'end') {
      sel = null; g.peek = null; R.endTurn(g);
      if (g.winner === null) { passFor = vsCpu ? null : g.turn; render(); maybeRunCpu(); return; }
      return render();
    }
    if (act === 'power') {
      if (sel && sel.kind === 'power') { sel = null; return render(); }
      if (!R.heroPowerUsable(g, g.turn)) return;
      if (R.HERO[g.hero[g.turn].id].power.to === 'none') { R.useHeroPower(g, g.turn, null); sel = null; return render(); }
      sel = { kind: 'power' }; return render();
    }
    if (act === 'notarget') { if (sel) doTarget(null); return; }
    if (act === 'cancel') { sel = null; return render(); }
    if (act === 'peekclose') { g.peek = null; return render(); }
    if (act === 'togglelog') { logOpen = !logOpen; return render(); }
    if (act === 'signout') { deckChoice = ['default', 'default']; ACC.signOut().then(render); return; }
    return;
  }
  if (!g || g.winner !== null || passFor !== null || cpuThinking || g.turn === 1 && vsCpu) return;
  const cardEl = e.target.closest('[data-card]');
  if (cardEl) {
    const hi = +cardEl.dataset.card;
    const id = g.hand[g.turn][hi];
    if (!id || !R.canPlay(g, g.turn, hi)) return;
    const mon = R.MONSTER[id];
    if (mon) {
      /* Summoning is never gated on a battlecry target — tcg-rules.js auto-picks one if the board
         offers any, and just skips the battlecry otherwise. Tap, it's on the field. */
      R.playCard(g, g.turn, hi); sel = null; return render();
    }
    const spell = R.SPELL[id];
    if (spell.to === 'none' && !spell.sac) { R.playCard(g, g.turn, hi, null); sel = null; return render(); }
    sel = sel && sel.kind === 'card' && sel.hi === hi ? null : { kind: 'card', hi };
    return render();
  }
  const heroEl = e.target.closest('[data-hero]');
  if (heroEl && sel) { return doTarget({ kind: 'hero' }); }
  const monEl = e.target.closest('[data-mon]');
  if (monEl) {
    const [t, idx] = monEl.dataset.mon.split(':').map(Number);
    if (sel) {
      const ok = targetsFor(g.turn).some(x => (sel.kind === 'mon' ? x.kind === 'monster' && x.team === t && x.idx === idx : x.kind === 'monster' && x.team === t && x.idx === idx));
      if (ok) return doTarget({ kind: 'monster', team: t, idx });
      sel = null; return render();
    }
    if (t === g.turn && R.canAttack(g, t, idx)) { sel = { kind: 'mon', idx }; return render(); }
  }
});
app.addEventListener('change', e => {
  if (e.target.matches('[data-deckpick]')) { deckChoice[+e.target.dataset.deckpick] = e.target.value; return render(); }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id !== 'signin') return;
  signinErr = ''; signinBusy = true; render();
  ACC.signIn(document.getElementById('su').value, document.getElementById('sp').value).then(() => {
    signinBusy = false; render();
  }, err => {
    signinBusy = false; signinErr = (err && err.message) ? err.message.replace(/&[a-z]+;/g, '-') : String(err); render();
  });
});
if (ACC) ACC.init(() => { if (!g) render(); });
else render();
</script>
</body>
</html>
