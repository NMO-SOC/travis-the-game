<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travis: Arena</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#07090d; --ink:#efe6cf; --ink-soft:#a99f88; --gold:#d6b25a; --gold-2:#f3dc97; --gold-d:#8a6a22;
  --t0:#5aa8ff; --t1:#ff7a52; --ember:#e0483a; --green:#6fcf4a;
  --title:"Cinzel","Trajan Pro",Georgia,serif; --deco:"Cinzel Decorative","Cinzel",Georgia,serif; --body:"Crimson Pro",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.4; min-height:100vh;
  background-image:radial-gradient(ellipse at 50% -10%, rgba(214,178,90,.14), transparent 55%),
    radial-gradient(ellipse at 50% 120%, rgba(224,72,58,.12), transparent 55%),
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
  background-size:auto,auto,6px 6px;
}
main{max-width:720px;margin:0 auto;padding:14px 14px 150px}
h1{font-family:var(--deco);font-weight:900;font-size:28px;letter-spacing:.03em;margin:8px 0 2px;
  background:linear-gradient(180deg,#fff3c4,#d6b25a 55%,#8a6a22);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--title);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
p{margin:4px 0}
.muted{opacity:.72;font-size:14px;font-style:italic;color:var(--ink-soft)}
a{color:var(--gold-2)}
input,select{font:inherit;color:var(--ink);background:#171a21;border:1px solid var(--gold-d);border-radius:8px;padding:8px 10px;margin:4px 0}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--title);font-weight:700;letter-spacing:.04em;
  color:var(--gold-2);background:linear-gradient(180deg,#2b2a2f,#141318);border:1px solid var(--gold-d);border-radius:10px;padding:10px 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 0 #000,0 0 0 1px #000;cursor:pointer;margin:4px 6px 4px 0;text-decoration:none;
  transition:box-shadow .15s,filter .15s,transform .1s}
.btn:not(:disabled):hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px #000,0 0 14px rgba(214,178,90,.4)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.gold{color:#1c1405;background:linear-gradient(180deg,#f7e2a1,#d6b25a 45%,#9c7626);border-color:#f7e2a1;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn:disabled{opacity:.32;cursor:default}
.btn.sm{padding:6px 11px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* ---- setup: opponent / hero / deck pickers ---- */
.hero-pick{display:flex;gap:10px;flex-wrap:wrap}
.hero-opt{border:1px solid var(--gold-d);border-radius:12px;padding:10px;width:150px;cursor:pointer;
  background:linear-gradient(180deg,#1d1c22,#101014);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.hero-opt.on{border-color:var(--gold-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px var(--gold-2)}
.hero-opt img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;object-position:50% 12%}
.hero-opt b{display:block;margin-top:8px;font-family:var(--title);font-size:14px;color:var(--gold-2)}
.hero-opt small{display:block;margin-top:2px;opacity:.75;font-size:12.5px}

/* ---- pass / thinking / game-over overlays ---- */
.pass{position:fixed;inset:0;z-index:20;background:#000d;display:grid;place-items:center;text-align:center;padding:24px}
.pass h2{font-family:var(--deco);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:none;color:var(--gold-2);margin:0 0 8px}
.over{position:fixed;inset:0;z-index:30;background:#000d;display:grid;place-items:center;text-align:center;padding:24px}
.over h1{font-size:44px;margin-bottom:14px}

/* ---- bottom action bar ---- */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,#07090d 60%,rgba(7,9,13,0));backdrop-filter:blur(6px);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--gold-d)}

/* ---- hero plates ---- */
.plate{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;
  background:linear-gradient(180deg,#1d1c22,#101014);border:1px solid var(--gold-d);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.plate.t0{box-shadow:inset 0 0 0 1px var(--t0),inset 0 1px 0 rgba(255,255,255,.06)}
.plate.t1{box-shadow:inset 0 0 0 1px var(--t1),inset 0 1px 0 rgba(255,255,255,.06)}
.plate img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:1px solid var(--gold-d)}
.plate div b{font-family:var(--title);font-size:12px;letter-spacing:.06em;color:var(--ink-soft);font-weight:700}
.plate .hp{font-family:var(--title);font-weight:900;font-size:19px;color:var(--green)}
.plate .hp.low{color:var(--ember)}
.plate.target{cursor:pointer;box-shadow:0 0 0 2px var(--gold-2),0 0 16px rgba(243,220,151,.5);animation:pulse .6s infinite alternate}

/* ---- the field ---- */
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;min-height:74px;padding:10px;
  border-radius:12px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(214,178,90,.15);margin:8px 0}
.mon{position:relative;border:1px solid #2a2a30;border-radius:10px;padding:6px;background:linear-gradient(180deg,#1b1a1f,#101014);
  cursor:default;text-align:center;transition:box-shadow .15s,transform .1s}
.mon.taunt{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(214,178,90,.35)}
.mon.ready{cursor:pointer;box-shadow:0 0 0 2px var(--green)}
.mon.ready:hover{transform:translateY(-2px)}
.mon.target{cursor:pointer;box-shadow:0 0 0 3px var(--gold-2),0 0 14px rgba(243,220,151,.45);animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px #fff8,0 0 18px rgba(243,220,151,.6)}}
.mon.sick{opacity:.55}
.mon img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;object-position:50% 12%}
.mon .name{font-family:var(--title);font-size:10.5px;font-weight:700;margin:5px 0 3px;line-height:1.15;min-height:2.3em;color:var(--ink)}
.mon .stats{font-family:var(--title);font-size:13px;font-weight:900;display:flex;justify-content:space-between;padding:0 1px}
.mon .stats .a{color:var(--t1)}.mon .stats .h{color:var(--green)}
.mon .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1c1405;
  font-family:var(--title);font-size:9px;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:9px;box-shadow:0 1px 0 #000}

/* ---- hand ---- */
.hand{display:flex;gap:9px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:thin}
.card{flex:none;width:98px;border:1px solid var(--gold-d);border-radius:11px;padding:6px;
  background:linear-gradient(180deg,#1d1c22,#101014);cursor:pointer;text-align:center;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:box-shadow .15s,transform .1s}
.card:not(.off):hover{transform:translateY(-3px)}
.card.on{border-color:var(--gold-2);box-shadow:0 0 0 2px var(--gold-2),0 0 14px rgba(243,220,151,.4)}
.card.off{opacity:.38;cursor:default}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px;object-position:50% 12%}
.card-icon{width:100%;aspect-ratio:3/4;border-radius:7px;background:radial-gradient(ellipse at 50% 30%,#2a2430,#0c0e13);
  display:grid;place-items:center;font-size:24px;color:var(--gold-2)}
.card .cost{position:absolute;top:-7px;left:-7px;width:27px;height:27px;border-radius:50%;
  background:linear-gradient(180deg,#f7e2a1,#d6b25a 45%,#9c7626);color:#1c1405;font-family:var(--title);font-weight:900;
  display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 2px #0c0e13,0 1px 0 #000}
.card .name{font-family:var(--title);font-size:10.5px;font-weight:700;margin-top:5px;line-height:1.15;min-height:2.3em;color:var(--ink)}
.card .txt{font-size:10.5px;line-height:1.25;min-height:2.6em;color:var(--ink-soft)}

/* ---- status line, log, peek ---- */
.status{text-align:center;font-family:var(--title);font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--ink-soft);margin:10px 0}
.status b{color:var(--gold-2)}
.points{font-family:var(--title);font-size:12.5px;color:var(--gold-2)}
.log{background:rgba(0,0,0,.35);border-radius:10px;padding:9px 12px;max-height:150px;overflow-y:auto;font-size:13.5px;
  box-shadow:inset 0 0 0 1px rgba(214,178,90,.12)}
.log p{margin:3px 0;color:var(--ink-soft)}
.peek{position:fixed;inset:0;z-index:25;background:#000c;display:grid;place-items:center;padding:20px}
.peek .box{background:linear-gradient(180deg,#1d1c22,#101014);border:1px solid var(--gold);border-radius:14px;padding:18px;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.peek .box h2{margin-top:0}
</style>
</head>
<body>
<main id="app"><p>Loading&hellip;</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="cards.js?v=20261006a"></script>
<script src="account.js?v=20261006a"></script>
<script src="tcg-cards.js?v=20261006a"></script>
<script src="tcg-rules.js?v=20261006c"></script>
<script>
'use strict';
/* Travis: Arena — hotseat 2-player, one device, pass between turns. Online sync and a real
   deckbuilder are still deferred (see TCG-MODE.md), but a signed-in player can bring one of their
   saved SmalLab decks (account.js) instead of the shared default — see deckFromSmalLab() below. All
   game logic lives in tcg-rules.js; this file is render + input only. */
const ACC = window.TravisAccount;
const R = TCGRules, app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const IMG = id => (R.MONSTER[id] && R.MONSTER[id].img) || (R.HERO[id] && R.HERO[id].img) || 'images/beer-frog-knox.jpg';

let g = null, names = ['Player 1', 'Player 2'], heroPick = [TCG_HEROES[0].id, TCG_HEROES[1].id];
let sel = null;          // {kind:'card', hi} or {kind:'mon', idx} or {kind:'power'} — what's "armed" to target
let passFor = null;      // team that must tap "I'm ready" before seeing the board (hides the other's hand)
let seenRound = 0;
let vsCpu = false;       // team 1 is a bot (tcg-rules.js cpuTurn) — no pass screen, no hero pick for it
let cpuThinking = false; // true while cpuTurn() is scheduled, to block input and show a status line
let deckChoice = ['default', 'default'];  // 'default' or a SmalLab deck id, per team (team 1 ignored when vsCpu)
let signinErr = '', signinBusy = false;

/* A signed-in player can bring one of their saved SmalLab decks instead of the shared default. There's
   no Arena deckbuilder yet (see TCG-MODE.md), so this is a mechanical conversion, not a real 1:1 port:
   each of the deck's 6 characters becomes 3 copies of its Arena monster card (favoring what they
   actually built around), plus every spell once, padded out to 45 by cycling the spell list. A
   character with no Arena equivalent (story/Chairman cards aren't in TCG_MONSTERS) is just skipped. */
function deckFromSmalLab(d) {
  const list = [];
  (d.characters || []).forEach(id => { if (R.MONSTER[id]) for (let i = 0; i < 3; i++) list.push(id); });
  TCG_SPELLS.forEach(s => list.push(s.id));
  for (let i = 0; list.length < 45; i++) list.push(TCG_SPELLS[i % TCG_SPELLS.length].id);
  return list.slice(0, 45);
}
function resolvedDeck(t) {
  if (t === 1 && vsCpu) return null; // the bot always plays the shared default deck
  if (deckChoice[t] === 'default' || !ACC || !ACC.decks) return null;
  const d = ACC.decks.find(x => String(x.id) === deckChoice[t]);
  return d ? deckFromSmalLab(d) : null;
}

function render() {
  if (!g) return renderSetup();
  if (passFor !== null) return renderPass();
  if (g.winner !== null) return renderOver();
  if (vsCpu && g.turn === 1) return renderThinking();
  renderBattle();
}
function renderThinking() {
  app.innerHTML = `<div class="pass"><div><h2>CPU is thinking&hellip;</h2>
    <p class="muted">Round ${g.round} &middot; ${esc(names[1])} is taking its turn.</p></div></div>`;
}

function renderSetup() {
  const opt = (t) => `<div class="hero-pick">${TCG_HEROES.map(h => `
    <div class="hero-opt ${heroPick[t] === h.id ? 'on' : ''}" data-pick="${t}:${h.id}">
      <img src="${h.img}" alt=""><b>${esc(h.n)}</b><small>${esc(h.power.n)}: ${esc(h.power.txt)}</small>
    </div>`).join('')}</div>`;
  const modeBtn = (v, label, sub) => `<div class="hero-opt ${vsCpu === v ? 'on' : ''}" data-mode="${v}" style="width:200px"><b>${label}</b><small>${sub}</small></div>`;
  const signedIn = ACC && ACC.ready && ACC.user && ACC.profile;
  // Only one Supabase session exists on this device, so only Player 1 can bring a signed-in account's
  // deck in hotseat — Player 2/CPU always get the shared default (no sign-out/in dance mid-pass).
  const deckPicker = (t) => {
    if (t !== 0) return vsCpu ? '' : '<p class="muted">Plays the shared default deck (only one SmalLab account can be signed in per device).</p>';
    if (!signedIn) return '<p class="muted">Sign in below to bring one of your saved decks — otherwise you play the shared default deck.</p>';
    const decks = ACC.decks || [];
    if (!decks.length) return '<p class="muted">No saved decks yet — build one in SmalLab mode&rsquo;s Decks screen, or just play the default deck.</p>';
    return `<select data-deckpick="${t}">
      <option value="default" ${deckChoice[t] === 'default' ? 'selected' : ''}>Default deck (shared, 45 cards)</option>
      ${decks.map(d => `<option value="${esc(String(d.id))}" ${deckChoice[t] === String(d.id) ? 'selected' : ''}>${esc(d.name)} (your SmalLab deck)</option>`).join('')}
    </select>`;
  };
  const signin = signedIn ? `<p>Signed in as <b>${esc(ACC.profile.username)}</b> &middot; <button class="btn sm" data-act="signout">Sign out</button></p>`
    : !ACC || !ACC.available ? ''
    : `<form id="signin"><input id="su" autocomplete="username" autocapitalize="none" placeholder="SmalLab username" required>
      <input id="sp" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn sm" ${signinBusy ? 'disabled' : ''}>Sign in to use my decks</button></form>
      ${signinErr ? `<p class="muted" style="color:var(--red)">${esc(signinErr)}</p>` : ''}`;
  app.innerHTML = `<h1>Travis: Arena</h1>
    <p class="muted">Summon monsters and cast spells from your hand by spending summon points — you gain one more each turn. Your hero has 30 HP; once your field is empty, that's what gets hit.</p>
    <h2>Opponent</h2>
    <div class="hero-pick">${modeBtn(false, 'Two Players', 'Pass the device each turn')}${modeBtn(true, 'Versus CPU', 'Play solo against a bot opponent')}</div>
    <h2>Your SmalLab account</h2>${signin}
    <h2>Player 1&rsquo;s hero</h2>${opt(0)}${deckPicker(0)}
    <h2>${vsCpu ? 'CPU&rsquo;s' : 'Player 2&rsquo;s'} hero</h2>${opt(1)}${deckPicker(1)}
    <button class="btn gold" data-act="start">Start game</button>
    <p class="muted"><a href="play.html" style="color:var(--gold-2)">&larr; Back to SmalLab mode</a></p>`;
}

function renderPass() {
  const t = passFor;
  app.innerHTML = `<div class="pass"><div><h2>Pass the device to ${esc(names[t])}</h2>
    <p class="muted">Nobody else look.</p>
    <button class="btn gold" data-act="reveal">I&rsquo;m ${esc(names[t])} — show my turn</button></div></div>`;
}

function renderOver() {
  app.innerHTML = `<div class="over"><div><h1>${esc(names[g.winner])} wins!</h1>
    <button class="btn gold" data-act="rematch">Rematch</button>
    <button class="btn" data-act="setup">New game</button></div></div>`;
}

function monCard(u, t, viewer) {
  const canSelectAsAttacker = sel === null && t === viewer && g.turn === viewer && R.canAttack(g, t, u.idx);
  const isTarget = sel && sel.kind !== 'power' ? targetsFor(viewer).some(x => x.kind === 'monster' && x.team === t && x.idx === u.idx) : false;
  const cls = ['mon', u.taunt ? 'taunt' : '', u.sick ? 'sick' : '', canSelectAsAttacker ? 'ready' : '', isTarget ? 'target' : ''].join(' ');
  return `<div class="${cls}" data-mon="${t}:${u.idx}">
    ${u.taunt ? '<span class="tag">TAUNT</span>' : ''}
    <img src="${IMG(u.id)}" alt="">
    <div class="name">${esc(u.n)}</div>
    <div class="stats"><span class="a">${Math.max(0, u.atk + (u.atkMod || 0))}&#9876;</span><span class="h">${u.hp}/${u.max}&#9829;</span></div>
  </div>`;
}

/* What a currently-armed selection (a hand card, a ready monster, or the hero power) can legally hit —
   drives both highlighting and the actual target sent to tcg-rules.js. kind:'monster' needs {team,idx};
   attacks compute their own via R.attackTargets. */
function targetsFor(viewer) {
  if (!sel) return [];
  const t = g.turn;
  if (sel.kind === 'mon') return R.attackTargets(g, t);
  const card = sel.kind === 'card' ? R.MONSTER[g.hand[t][sel.hi]] || R.SPELL[g.hand[t][sel.hi]] : R.HERO[g.hero[t].id].power;
  const to = card.to;
  if (to === 'enemy') return R.aliveField(g, 1 - t).map(u => ({ kind: 'monster', team: 1 - t, idx: u.idx }));
  if (to === 'friend') return R.aliveField(g, t).map(u => ({ kind: 'monster', team: t, idx: u.idx }));
  if (to === 'friendOrNone') return R.aliveField(g, t).map(u => ({ kind: 'monster', team: t, idx: u.idx })).concat([{ kind: 'none' }]);
  return [];
}

function handCard(id, hi, t) {
  const mon = R.MONSTER[id], c = mon || R.SPELL[id];
  const affordable = c.cost <= g.points[t] && g.turn === t;
  const on = sel && sel.kind === 'card' && sel.hi === hi;
  const art = mon ? `<img src="${mon.img}" alt="">` : `<div class="card-icon">&#10024;</div>`;
  return `<div class="card ${on ? 'on' : ''} ${affordable ? '' : 'off'}" data-card="${hi}">
    <span class="cost">${c.cost}</span>${art}
    <div class="name">${esc(c.n)}</div>
    <div class="txt">${c.txt || c.flavor || ''}</div>
  </div>`;
}

function renderBattle() {
  const viewer = g.turn, me = viewer, opp = 1 - viewer;
  const heroTargetable = t => t === opp && !!sel && sel.kind === 'mon' && targetsFor(viewer).some(x => x.kind === 'hero');
  const hpTag = (h, t) => `<div class="plate t${t} ${heroTargetable(t) ? 'target' : ''}" ${heroTargetable(t) ? `data-hero="${t}"` : ''}><img src="${IMG(h.id)}" alt=""><div><div>${esc(names[t])}</div><div class="hp ${h.hp <= 10 ? 'low' : ''}">${h.hp}/${h.max}</div></div></div>`;
  const power = R.HERO[g.hero[me].id].power;
  const powerOn = sel && sel.kind === 'power';
  const canPower = R.heroPowerUsable(g, me);
  app.innerHTML = `
    <div class="status">${esc(names[opp])}&rsquo;s field</div>
    <div class="field">${g.field[opp].map(u => monCard(u, opp, viewer)).join('') || '<p class="muted" style="margin:auto">No monsters — attacks hit the hero.</p>'}</div>
    ${hpTag(g.hero[opp], opp)}
    <div class="status">Round ${g.round} &middot; ${esc(names[me])}&rsquo;s turn &middot; <span class="points">${g.points[me]} / ${g.maxPoints[me]} summon points</span></div>
    ${hpTag(g.hero[me], me)}
    <div class="field">${g.field[me].map(u => monCard(u, me, viewer)).join('') || '<p class="muted" style="margin:auto">No monsters on your field yet.</p>'}</div>
    <h2>Your hand</h2>
    <div class="hand">${g.hand[me].map((id, hi) => handCard(id, hi, me)).join('') || '<p class="muted">Empty hand.</p>'}</div>
    <h2>Battle log</h2>
    <div class="log" id="log">${g.log.slice(-40).map(l => `<p>${l}</p>`).join('')}</div>
    <div class="bar">
      <button class="btn sm ${powerOn ? 'gold' : ''}" data-act="power" ${canPower || powerOn ? '' : 'disabled'}>${esc(power.n)} (${power.cost})</button>
      ${sel && targetsFor(me).some(x => x.kind === 'none') ? '<button class="btn sm gold" data-act="notarget">Target your hero</button>' : ''}
      ${sel ? '<button class="btn sm" data-act="cancel">Cancel</button>' : ''}
      <button class="btn gold" data-act="end">End turn</button>
    </div>
    ${g.peek && g.peek.team === me ? peekHtml() : ''}`;
  const log = document.getElementById('log'); if (log) log.scrollTop = log.scrollHeight;
}

function peekHtml() {
  const hand = g.peek.hand.map(id => (R.MONSTER[id] || R.SPELL[id]).n).join(', ') || 'nothing';
  return `<div class="peek" data-act="peekclose"><div class="box"><h2>Opponent&rsquo;s hand</h2><p>${esc(hand)}</p>
    <button class="btn gold sm" data-act="peekclose">Got it</button></div></div>`;
}

/* ---------------- actions ---------------- */
function startGame() {
  g = R.newGame(heroPick, [resolvedDeck(0), resolvedDeck(1)], Math.random);
  names = vsCpu ? ['Player 1', 'CPU'] : ['Player 1', 'Player 2'];
  seenRound = 1; sel = null; cpuThinking = false;
  passFor = vsCpu ? null : 0; // CPU never needs a pass screen — only one human at the table
  render();
}
/* Runs after any action that might have ended the turn — if it's now the bot's turn, let it play
   itself out on a short delay (so it reads as "thinking" rather than instant), then hand back.
   cpuThinking is just a re-entrancy guard against scheduling two overlapping bot turns. */
function maybeRunCpu() {
  if (!vsCpu || !g || g.winner !== null || g.turn !== 1 || cpuThinking) return;
  cpuThinking = true;
  setTimeout(() => {
    cpuThinking = false;
    if (!g || g.turn !== 1 || g.winner !== null) return; // the player bailed to setup mid-think
    R.cpuTurn(g, 1);
    render();
  }, 550);
}
function doTarget(target) {
  const t = g.turn;
  if (sel.kind === 'mon') { R.attack(g, t, sel.idx, target); }
  else if (sel.kind === 'power') { R.useHeroPower(g, t, target && target.kind === 'monster' ? target : null); }
  else {
    const id = g.hand[t][sel.hi], c = R.SPELL[id];
    if (c && c.sac) {
      const alive = R.aliveField(g, t);
      const weakest = alive.length ? alive.reduce((a, b) => a.hp <= b.hp ? a : b) : null;
      R.playCard(g, t, sel.hi, target && target.kind === 'monster' ? target : null, weakest ? weakest.idx : null);
    } else {
      R.playCard(g, t, sel.hi, target && target.kind === 'monster' ? target : null);
    }
  }
  sel = null; render();
}
app.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if (pick) { const [t, id] = pick.dataset.pick.split(':'); heroPick[+t] = id; return render(); }
  const mode = e.target.closest('[data-mode]');
  if (mode) { vsCpu = mode.dataset.mode === 'true'; return render(); }
  const b = e.target.closest('[data-act]');
  if (b) {
    const act = b.dataset.act;
    if (act === 'start') return startGame();
    if (act === 'setup') { g = null; sel = null; passFor = null; return render(); }
    if (act === 'rematch') return startGame();
    if (act === 'reveal') { passFor = null; return render(); }
    if (act === 'end') {
      sel = null; g.peek = null; R.endTurn(g);
      if (g.winner === null) { passFor = vsCpu ? null : g.turn; render(); maybeRunCpu(); return; }
      return render();
    }
    if (act === 'power') {
      if (sel && sel.kind === 'power') { sel = null; return render(); }
      if (!R.heroPowerUsable(g, g.turn)) return;
      if (R.HERO[g.hero[g.turn].id].power.to === 'none') { R.useHeroPower(g, g.turn, null); sel = null; return render(); }
      sel = { kind: 'power' }; return render();
    }
    if (act === 'notarget') { if (sel) doTarget(null); return; }
    if (act === 'cancel') { sel = null; return render(); }
    if (act === 'peekclose') { g.peek = null; return render(); }
    if (act === 'signout') { deckChoice = ['default', 'default']; ACC.signOut().then(render); return; }
    return;
  }
  if (!g || g.winner !== null || passFor !== null || cpuThinking || g.turn === 1 && vsCpu) return;
  const cardEl = e.target.closest('[data-card]');
  if (cardEl) {
    const hi = +cardEl.dataset.card;
    const id = g.hand[g.turn][hi];
    if (!id || !R.canPlay(g, g.turn, hi)) return;
    if (R.MONSTER[id]) { R.playCard(g, g.turn, hi); sel = null; return render(); }
    const spell = R.SPELL[id];
    if (spell.to === 'none' && !spell.sac) { R.playCard(g, g.turn, hi, null); sel = null; return render(); }
    sel = sel && sel.kind === 'card' && sel.hi === hi ? null : { kind: 'card', hi };
    return render();
  }
  const heroEl = e.target.closest('[data-hero]');
  if (heroEl && sel) { return doTarget({ kind: 'hero' }); }
  const monEl = e.target.closest('[data-mon]');
  if (monEl) {
    const [t, idx] = monEl.dataset.mon.split(':').map(Number);
    if (sel) {
      const ok = targetsFor(g.turn).some(x => (sel.kind === 'mon' ? x.kind === 'monster' && x.team === t && x.idx === idx : x.kind === 'monster' && x.team === t && x.idx === idx));
      if (ok) return doTarget({ kind: 'monster', team: t, idx });
      sel = null; return render();
    }
    if (t === g.turn && R.canAttack(g, t, idx)) { sel = { kind: 'mon', idx }; return render(); }
  }
});
app.addEventListener('change', e => {
  if (e.target.matches('[data-deckpick]')) { deckChoice[+e.target.dataset.deckpick] = e.target.value; return render(); }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id !== 'signin') return;
  signinErr = ''; signinBusy = true; render();
  ACC.signIn(document.getElementById('su').value, document.getElementById('sp').value).then(() => {
    signinBusy = false; render();
  }, err => {
    signinBusy = false; signinErr = (err && err.message) ? err.message.replace(/&[a-z]+;/g, '-') : String(err); render();
  });
});
if (ACC) ACC.init(() => { if (!g) render(); });
else render();
</script>
</body>
</html>
