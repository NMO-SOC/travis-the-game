<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travis: The Game — Play</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --paper:#EFF2F1; --card:#FBFCFB; --ink:#10202C; --ink-soft:#4A5C67;
  --suit:#1D4E89; --abyss:#0B2545; --frog:#5F8F35; --sand:#C9B48A; --rule:#B9C4C6;
  --rust:#A8472A; --red:#B3261E;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --disp:"Archivo Black",Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:Spectral,Georgia,serif; font-size:15px; line-height:1.45;
  background-image:linear-gradient(rgba(29,78,137,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(29,78,137,.055) 1px,transparent 1px);
  background-size:22px 22px; min-height:100vh;
}
#app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:var(--suit)}
.muted{color:var(--ink-soft);font-style:italic}
.t0{--tc:var(--suit)} .t1{--tc:var(--rust)}
b.t0,b.t1,.who{color:var(--tc)}
.eyebrow,.gl,.sl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--suit)}

/* bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;border-top:5px solid var(--abyss);border-bottom:1px solid var(--rule);padding-block:10px;margin-bottom:14px}
.brand{font-family:var(--disp);font-size:20px;color:var(--abyss)} .brand em{font-style:normal;color:var(--frog)}
.meta{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;flex:1}
.meta b{color:var(--ink)}
.flag{background:var(--abyss);color:var(--sand);padding:2px 7px;letter-spacing:.08em}
.btns{display:flex;gap:8px;margin-left:auto}
.btns button,.btns a{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid var(--abyss);padding:5px 10px;color:var(--abyss);text-decoration:none}
.btns button:hover,.btns a:hover{background:var(--abyss);color:var(--paper)}

/* menu */
.menu{max-width:640px;margin:6vh auto 0;border-top:6px solid var(--abyss);padding-top:22px}
.menu h1{font-family:var(--disp);font-size:clamp(44px,10vw,78px);line-height:.92;letter-spacing:-.02em;color:var(--abyss);margin:10px 0 10px}
.menu h1 em{font-style:normal;color:var(--frog)}
.dek{font-size:17px;color:var(--ink-soft);max-width:56ch;margin:0 0 22px}
.group{margin-bottom:16px}.gl{margin-bottom:7px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{text-align:left;background:var(--card);border:1.5px solid var(--rule);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.choice b{font-family:var(--disp);font-weight:400;font-size:16px;color:var(--abyss)}
.choice span{font-size:13px;color:var(--ink-soft)}
.choice.on{border-color:var(--abyss);box-shadow:inset 0 0 0 1.5px var(--abyss);background:#fff}
.go{font-family:var(--disp);font-size:17px;background:var(--abyss);color:var(--paper);border:0;padding:13px 20px;margin-top:6px}
.go:hover{background:var(--suit)}
.quick{margin-top:30px;border-top:1px solid var(--rule);padding-top:14px}
.quick ul{padding-left:1.1em;margin:8px 0}.quick li{margin-bottom:5px}

/* draft */
.dhead{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:14px}
.dp{border:1.5px solid var(--rule);background:var(--card);padding:8px 10px}
.dp.now{border-color:var(--tc);box-shadow:inset 4px 0 0 var(--tc)}
.dpn{font-family:var(--disp);color:var(--tc)} .dpn span{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.08em;margin-left:6px}
.dpl{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{font-family:var(--mono);font-size:10.5px;background:var(--tc);color:#fff;padding:2px 7px}
.dmsg{align-self:center;text-align:center;font-size:16px;max-width:24ch}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dt{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--abyss);padding:0;display:flex;flex-direction:column;overflow:hidden}
.dt:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 0 -2px var(--abyss)}
.dt.taken{opacity:.45;border-color:var(--tc)}
.own{position:absolute;top:6px;right:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--tc);color:#fff;padding:2px 6px}
.plate{height:64px;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(29,78,137,.09) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(29,78,137,.09) 1px,transparent 1px) 0 0/12px 12px,#F3F6F5;border-bottom:1px solid var(--rule)}
.plate svg{width:50px;height:50px}
.ct{background:var(--abyss);color:#EFF2F1;padding:5px 9px}
.cn{font-family:var(--disp);font-size:14px;line-height:1.1}
.cr{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
.cs{display:flex;justify-content:space-around;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);border-bottom:1px solid var(--rule);padding:4px 0}
.cs b{font-family:var(--disp);font-weight:400;font-size:14px;color:var(--abyss)} .hpv{color:var(--frog)!important}
.ca{font-size:12.5px;line-height:1.35;padding:6px 9px 9px}
.ca b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--suit)}

/* battle layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.team{margin-bottom:6px}
.th{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:7px}
.pn{font-family:var(--disp);font-size:15px;color:var(--tc,var(--abyss))}
.hc{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.flood{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--frog);color:#fff;border:0;padding:5px 10px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(95,143,53,.3)}}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.u{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--tc);padding:0;display:flex;flex-direction:column;min-height:196px;transition:transform .15s,box-shadow .15s,opacity .15s}
.u .uh{background:var(--tc);color:#fff;font-family:var(--disp);font-size:12.5px;line-height:1.1;padding:5px 7px;min-height:36px;display:flex;align-items:center}
.u .up{height:52px;display:flex;align-items:center;justify-content:center;background:#F3F6F5;border-bottom:1px solid var(--rule)}
.u .up svg{width:42px;height:42px}
.hpb{position:relative;height:18px;margin:7px 7px 3px;background:#E1E7E6;border:1px solid var(--rule)}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--frog);transition:width .3s}
.hpb.over i{background:var(--sand)}
.hpb b{position:relative;display:block;text-align:center;font-family:var(--mono);font-size:11px;line-height:16px;font-weight:600}
.us{display:flex;justify-content:space-between;padding:0 8px;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.us b{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--abyss)}
.us b.bu{color:var(--frog)} .us b.bd{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding:5px 6px 7px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:1px 5px;border:1px solid currentColor;white-space:nowrap}
.chip.g{color:var(--frog)} .chip.b{color:var(--suit)} .chip.r{color:var(--red)} .chip.m{color:var(--ink-soft);opacity:.8}
.u.cur{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--tc);transform:translateY(-3px)}
.u.done{opacity:.72}
.u.insp{outline:2px dashed var(--ink-soft);outline-offset:3px}
.u.pick{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--frog);animation:pulse 1.2s infinite}
.u.pick:hover{transform:translateY(-3px)}
.u.dim{opacity:.35}
.u.ko{opacity:.55;filter:grayscale(1);border-style:dashed}
.u.ko.pick{opacity:1;filter:none}
.kotag{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--disp);font-size:13px;color:var(--red);border:2px solid var(--red);padding:2px 8px;background:rgba(251,252,251,.9);white-space:nowrap}
.float{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--disp);font-size:26px;pointer-events:none;animation:rise 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
.float.dmg{color:var(--red)} .float.heal{color:var(--frog)} .float.blk{color:var(--suit)}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-38px)}}

.status{margin:12px 0;padding:10px 12px;background:var(--abyss);color:#EFF2F1;font-size:15px;min-height:44px}
.status b.t0{color:#8FB3D9} .status b.t1,.status .who.t1{color:#E9A48C} .status .who.t0{color:#8FB3D9}
.status .muted{color:#A9C0D8}
.status .who{font-family:var(--disp);font-weight:400}
.lnk{background:none;border:0;border-bottom:1px solid currentColor;padding:0 1px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-left:8px;color:inherit}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.ab{text-align:left;background:var(--card);border:1.5px solid var(--abyss);padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.ab b{font-family:var(--disp);font-weight:400;font-size:15px;color:var(--abyss);line-height:1.1}
.ab span{font-size:12.5px;color:var(--ink-soft)}
.ab:not(:disabled):hover{background:var(--abyss)} .ab:not(:disabled):hover b,.ab:not(:disabled):hover span{color:var(--paper)}
.ab.ability{border-color:var(--suit)} .ab.end{border-style:dashed}
.ab:disabled{opacity:.4}
.abtext{font-size:13.5px;margin:8px 0 0;color:var(--ink-soft)} .abtext b{color:var(--ink)}

.hand{margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.hc-card{text-align:left;background:var(--card);border:1.5px solid var(--frog);padding:0 0 8px;display:flex;flex-direction:column;opacity:.6}
.hc-card.ok{opacity:1}
.hc-card.ok:hover{transform:translateY(-3px);box-shadow:0 6px 0 -2px var(--frog)}
.hci{height:40px;display:flex;align-items:center;justify-content:center;background:#F5F8F1}
.hci svg{width:32px;height:32px}
.hcn{background:var(--frog);color:#fff;font-family:var(--disp);font-size:13px;line-height:1.1;padding:5px 8px}
.hct{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--frog);padding:5px 8px 0}
.hca{font-size:12.5px;line-height:1.35;padding:2px 8px 0}
.empty{padding:8px 0}

/* sidebar */
aside{display:flex;flex-direction:column;gap:16px}
.side .sl{border-bottom:2px solid var(--abyss);padding-bottom:4px;margin-bottom:8px;color:var(--abyss)}
.insp-card{background:var(--card);border:1.5px solid var(--tc)}
.ih{background:var(--tc);color:#fff;padding:7px 10px}
.ino{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.ih h3{font-family:var(--disp);font-weight:400;font-size:17px;line-height:1.05;margin:2px 0}
.ir{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#F1E4C6}
.ip{height:70px;display:flex;align-items:center;justify-content:center;background:#F3F6F5;border-bottom:1px solid var(--rule)}
.ip svg{width:56px;height:56px}
.is{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1.5px solid var(--tc)}
.is div{text-align:center;padding:4px 0;border-right:1px solid var(--rule)} .is div:last-child{border:0}
.is span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-soft)}
.is b{font-family:var(--disp);font-weight:400;font-size:17px;color:var(--abyss)}
.ib{padding:8px 10px}
.ian{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--suit)}
.ian em{font-style:normal;color:var(--red)}
.ib p{margin:4px 0;font-size:13.5px}
.ifl{font-style:italic;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:5px;font-size:12.5px!important}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.order li{display:flex;justify-content:space-between;font-size:13px;padding:3px 8px;border-left:4px solid var(--tc);background:var(--card)}
.order li.now{background:var(--tc);color:#fff}
.order li b{font-family:var(--mono)}
.log{max-height:340px;overflow-y:auto;font-size:13px;background:var(--card);border:1px solid var(--rule);padding:6px 10px}
.log p{margin:0 0 5px}
.log p.round{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--suit);border-top:1px solid var(--rule);padding-top:6px;margin-top:6px}
.log p.turn{color:var(--ink-soft)}
.log p.ko b:first-child{text-decoration:line-through}
.log p.win{font-family:var(--disp);color:var(--frog)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(11,37,69,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.soft{background:rgba(11,37,69,.45)}
.ov.solid{background:var(--abyss)}
.panel{background:var(--paper);border-top:6px solid var(--abyss);padding:20px 22px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.panel h2{font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.15;color:var(--abyss);margin:6px 0 12px}
.panel h2.t0,.panel h2.t1{color:var(--tc);font-size:34px}
.panel.pass{text-align:center}
.opts{display:grid;gap:8px;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--abyss);padding:9px 12px}
.opt:hover{background:#fff;box-shadow:inset 4px 0 0 var(--frog)}
.opt b{display:block;font-family:var(--disp);font-weight:400;font-size:15px;color:var(--abyss)}
.opt span span{font-size:13px;color:var(--ink-soft)}
.oi svg{width:34px;height:34px;display:block}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.panel .lnk{color:var(--abyss)}
.err{white-space:pre-wrap;background:#fee;border:1px solid var(--red);padding:10px;font-size:12px;overflow-x:auto}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .log{max-height:220px}
}
@media (max-width:600px){
  .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .units{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dhead{grid-template-columns:minmax(0,1fr)}
  .dmsg{max-width:none;order:-1}
  .choices{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .meta{order:3;flex-basis:100%}
  .dgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .kotag{font-size:11px}
  .chip{white-space:normal}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="cards.js"></script>
<script src="play.js"></script>
<script>TravisGame.mount(document.getElementById('app'));</script>
</body>
</html>
