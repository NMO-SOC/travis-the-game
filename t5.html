<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travis: T5 — Join</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0c0e13;color:#fff;font:18px/1.35 "Segoe UI",system-ui,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;margin:8px 0 4px}
h2{font-size:20px;margin:18px 0 8px}
p{margin:6px 0}
.muted{opacity:.7;font-size:15px}
.err{background:#e0483a33;border:1px solid #e0483a;padding:10px;border-radius:10px}
input,select{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #333;background:#171a21;color:#fff;margin:6px 0}
input.code{text-transform:uppercase;letter-spacing:.12em;font-size:26px;font-weight:800;text-align:center}
button{width:100%;font:inherit;font-weight:800;font-size:20px;padding:16px;border:0;border-radius:14px;background:#ffd54a;color:#000;margin:8px 0}
button.alt{background:#2a2f3a;color:#fff}
button:disabled{opacity:.4}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:800;background:var(--tc);color:#000}
.t0{--tc:#5aa8ff}.t1{--tc:#ff7a52}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;border:3px solid #333;border-radius:12px;overflow:hidden;background:#171a21;padding:0;margin:0;color:#fff;font-size:14px;font-weight:600;text-align:left}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 12%;display:block}
.card div{padding:6px}
.card small{display:block;opacity:.75;font-weight:400}
.card.on{border-color:#ffd54a;box-shadow:0 0 0 3px #ffd54a}
.card .n{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:#ffd54a;color:#000;display:grid;place-items:center;font-weight:900}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts span{background:#f4ecd6;color:#111;border-radius:8px;padding:4px 8px;font-size:14px}
.acts span.no{background:#444;color:#aaa;text-decoration:line-through}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#000d;backdrop-filter:blur(6px)}
.bar button{max-width:528px;display:block;margin:0 auto}
.big{font-size:26px;font-weight:900;margin:20px 0}
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="cards.js?v=20260917h"></script>
<script src="account.js?v=20260917d"></script>
<script src="t5-rules.js"></script>
<script>
'use strict';
/* Travis: T5 phone page. Sign in, join the code shown on the T5 screen, choose 3 characters from a saved deck
   (or all your cards) and send them. The T5 screen (t5-display.html) runs the game; nothing is saved. */
const A = window.TravisAccount, R = T5Rules, app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const CODE_RE = /^[A-Z]{4}-\d{2}$/;
let pid = '';
try { pid = sessionStorage.getItem('t5.pid') || ''; } catch (e) {}
if (!pid) { pid = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => (b % 36).toString(36)).join('') + Date.now().toString(36).slice(-4); try { sessionStorage.setItem('t5.pid', pid); } catch (e) {} }

const st = {code: (new URLSearchParams(location.search).get('code') || '').toUpperCase(), error: '', busy: false,
  chan: null, lobby: null, seen: 0, joinedAt: 0, source: '', picks: [], ready: false};

/* ---------------- channel ---------------- */
function connect() {
  disconnect();
  st.lobby = null; st.seen = 0; st.joinedAt = Date.now(); st.ready = false; st.picks = [];
  const c = A.client();
  st.chan = c.channel('t5-' + st.code, {config: {broadcast: {self: false}}});
  st.chan.on('broadcast', {event: 'lobby'}, ({payload}) => {
    st.lobby = payload; st.seen = Date.now();
    const i = mySlot();
    if (i < 0 && payload.slots.includes(null) && !(payload.kicked || []).includes(pid)) send('join', {name: A.profile.username});
    else if (i >= 0 && st.ready && !payload.slots[i].ready) send('ready', {name: A.profile.username, deck: deck()});  // screen missed it
    render();
  });
  st.chan.subscribe(st => { if (st === 'SUBSCRIBED') send('join', {name: A.profile.username}); });
  render();
}
function disconnect() {
  if (st.chan) { send('leave', {}); const ch = st.chan; setTimeout(() => A.client().removeChannel(ch), 300); }
  st.chan = null;
}
function send(event, payload) { if (st.chan) st.chan.send({type: 'broadcast', event, payload: Object.assign({pid}, payload)}); }
const mySlot = () => st.lobby ? st.lobby.slots.findIndex(s => s && s.pid === pid) : -1;
addEventListener('pagehide', () => { if (st.chan) send('leave', {}); });
setInterval(render, 2000);  // updates "can't find the screen"

/* ---------------- cards ---------------- */
const owned = c => A.ownsChar(c) || A.qtyTotal(c.id) > 0;
function sources() {
  const decks = (A.decks || []).map(d => ({id: d.id, name: d.name, chars: d.characters, acts: d.actions}));
  return decks.concat([{id: 'all', name: 'All my cards (starter action cards)', chars: chars.filter(owned).map(c => c.id), acts: []}]);
}
function source() { const all = sources(); return all.find(s => s.id === st.source) || all[0]; }
function deck() {
  const src = source(), spirit = {};
  src.acts.filter(id => id.endsWith('-spirit')).forEach(id => { spirit[id] = Math.max(1, A.qty(id, false)); });
  return {chars: st.picks.slice(), acts: src.acts, spirit};
}

/* ---------------- screens ---------------- */
let shown = '';
function render() {
  if (!A.ready) return;
  const html = !A.available ? '<h1>Travis: T5</h1><p class="err">Can’t reach the Travis server. Check your internet connection.</p>'
    : !A.user ? signInView() : !st.chan ? codeView() : lobbyView();
  if (html !== shown) app.innerHTML = shown = html;  // only when something changed, so typing and open menus survive
}
const head = () => `<h1>Travis: T5</h1>${st.error ? `<p class="err">${esc(st.error)}</p>` : ''}`;
function signInView() {
  return head() + `<p>Sign in with your Travis account.</p>
    <form id="signin"><input id="u" autocomplete="username" autocapitalize="none" placeholder="Username" required>
    <input id="p" type="password" autocomplete="current-password" placeholder="Password" required>
    <button ${st.busy ? 'disabled' : ''}>Sign in</button></form>
    <p class="muted">No account? Make one in <a href="play.html" style="color:#ffd54a">Travis: The Game</a> first.</p>`;
}
function codeView() {
  return head() + `<p>Signed in as <b>${esc(A.profile.username)}</b>.</p>
    <form id="join"><p>Enter the code on the T5 screen:</p>
    <input id="code" class="code" maxlength="7" placeholder="ABCD-12" value="${esc(st.code)}" autocapitalize="characters" required>
    <button>Join</button></form>
    <button class="alt" data-act="signout">Sign out</button>`;
}
function lobbyView() {
  const i = mySlot(), lost = !st.seen && Date.now() - st.joinedAt > 8000, stale = st.seen && Date.now() - st.seen > 10000;
  const leave = '<button class="alt" data-act="leave">Leave</button>';
  if (lost) return head() + `<p class="err">No T5 screen found with code <b>${esc(st.code)}</b>. Check the code on the screen.</p>${leave}`;
  if (!st.lobby) return head() + `<p class="big">Looking for the T5 screen…</p>${leave}`;
  if ((st.lobby.kicked || []).includes(pid)) return head() + `<p class="err">You were removed from this game.</p>${leave}`;
  if (i < 0) return head() + `<p class="err">This game already has two players.</p>${leave}`;
  const who = `<p><span class="badge t${i}">Player ${i + 1}</span> <b>${esc(A.profile.username)}</b> · you stand at the <b>${i ? 'top' : 'bottom'}</b> edge</p>`
    + (stale ? '<p class="err">Lost contact with the T5 screen…</p>' : '');
  if (st.lobby.playing) return head() + who + '<p class="big">Game on! Look at the floor.</p>';
  if (st.ready) return head() + who + `<p class="big">Ready! Waiting for the game to start.</p>
    <div class="grid">${st.picks.map(id => charCard(R.CHAR[id])).join('')}</div>
    <button class="alt" data-act="change">Change cards</button>${leave}`;
  const src = source(), acts = src.acts, bad = acts.filter(id => !R.ACTIONS[id]);
  return head() + who + `<h2>1. Choose a deck</h2>
    <select id="source">${sources().map(s => `<option value="${esc(s.id)}" ${s.id === src.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
    <h2>2. Pick 3 characters <span class="muted">(${st.picks.length}/3)</span></h2>
    <div class="grid">${[...new Set(src.chars)].map(id => R.CHAR[id]).filter(Boolean).map(c => charCard(c, true)).join('')}</div>
    <h2>Action cards</h2>
    ${acts.length ? `<div class="acts">${acts.map(id => `<span class="${R.ACTIONS[id] ? '' : 'no'}">${R.ACT[id] ? R.ACT[id].n : esc(id)}</span>`).join('')}</div>
      ${bad.length ? '<p class="muted">Crossed-out cards aren’t in T5 yet.</p>' : ''}` : ''}
    ${acts.filter(id => R.ACTIONS[id]).length < 8 ? '<p class="muted">Small action decks are topped up with starter cards.</p>' : ''}
    ${leave}
    <div class="bar"><button data-act="ready" ${st.picks.length === R.TEAM ? '' : 'disabled'}>Ready</button></div>`;
}
function charCard(c, pickable) {
  const n = st.picks.indexOf(c.id);
  return `<button class="card ${pickable && n >= 0 ? 'on' : ''}" ${pickable ? `data-pick="${c.id}"` : 'disabled style="opacity:1"'}>
    <img src="${c.img}" alt="">${pickable && n >= 0 ? `<span class="n">${n + 1}</span>` : ''}
    <div>${c.n.replace(' Knox', '')}<small>${c.hp} HP · ${c.atks.map(m => m.dmg).join('/')} dmg</small></div></button>`;
}

/* ---------------- events ---------------- */
app.addEventListener('submit', async e => {
  e.preventDefault(); st.error = '';
  if (e.target.id === 'signin') {
    st.busy = true; render();
    try { await A.signIn(document.getElementById('u').value, document.getElementById('p').value); }
    catch (err) { st.error = err.message.replace(/&[a-z]+;/g, '–'); }
    st.busy = false; render();
  } else if (e.target.id === 'join') {
    const v = document.getElementById('code').value.trim().toUpperCase().replace(/\s/g, '');
    if (!CODE_RE.test(v)) { st.error = 'Codes look like ABCD-12.'; return render(); }
    st.code = v; history.replaceState(null, '', '?code=' + v); connect();
  }
});
app.addEventListener('change', e => { if (e.target.id === 'source') { st.source = e.target.value; st.picks = []; render(); } });
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-pick]');
  if (!b) return;
  const act = b.dataset.act, pick = b.dataset.pick;
  if (pick) {
    const i = st.picks.indexOf(pick);
    if (i >= 0) st.picks.splice(i, 1); else if (st.picks.length < R.TEAM) st.picks.push(pick);
  }
  if (act === 'ready') { st.ready = true; send('ready', {name: A.profile.username, deck: deck()}); }
  if (act === 'change') { st.ready = false; send('unready', {}); }
  if (act === 'leave') { disconnect(); st.error = ''; }
  if (act === 'signout') await A.signOut();
  render();
});

let autoJoined = false;  // join the QR code's session once, straight after sign-in
A.init(() => { if (A.user && !autoJoined && CODE_RE.test(st.code)) { autoJoined = true; connect(); } render(); });
</script>
</body>
</html>
